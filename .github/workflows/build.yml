name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test

  build-image:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            suffix: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            suffix: arm64
    runs-on: ${{ matrix.runner }}
    needs: test
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ghcr.io/jonathanlew1s/music-assistant-db-api:${{ github.sha }}-${{ matrix.suffix }}
            ghcr.io/jonathanlew1s/music-assistant-db-api:latest-${{ matrix.suffix }}

  publish-manifest:
    runs-on: ubuntu-latest
    needs: build-image
    if: github.ref == 'refs/heads/main'
    permissions:
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-arch manifests
        run: |
          docker buildx imagetools create \
            --tag ghcr.io/jonathanlew1s/music-assistant-db-api:${{ github.sha }} \
            ghcr.io/jonathanlew1s/music-assistant-db-api:${{ github.sha }}-amd64 \
            ghcr.io/jonathanlew1s/music-assistant-db-api:${{ github.sha }}-arm64
          docker buildx imagetools create \
            --tag ghcr.io/jonathanlew1s/music-assistant-db-api:latest \
            ghcr.io/jonathanlew1s/music-assistant-db-api:latest-amd64 \
            ghcr.io/jonathanlew1s/music-assistant-db-api:latest-arm64
